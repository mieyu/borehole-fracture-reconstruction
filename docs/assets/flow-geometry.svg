<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="448" viewBox="0 0 1040 448" role="img" aria-labelledby="title desc">
<title id="title">需求 02｜裂隙聚类与几何参数提取</title><desc id="desc">GEOMETRY  ·  INSTANCE EXTRACTION + METRIC CALIBRATION + ROBUST FITTING</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#454545"/></marker></defs>
<rect width="1040" height="448" fill="#fff"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#222">
<text x="36" y="37" font-size="22" font-weight="600" text-anchor="start" fill="#222">需求 02｜裂隙聚类与几何参数提取</text>
<text x="36" y="61" font-size="13" font-weight="400" text-anchor="start" fill="#666" letter-spacing="1.1">GEOMETRY  ·  INSTANCE EXTRACTION + METRIC CALIBRATION + ROBUST FITTING</text>
<path d="M36 77 H1004" fill="none" stroke="#aaa" stroke-width="0.8"/>
<rect x="36" y="99" width="284" height="46" fill="#f4f4f4" stroke="#aaa" stroke-width="0.8"/>
<text x="178.0" y="128" font-size="15" font-weight="400" text-anchor="middle" fill="#222">裂隙掩码</text>
<rect x="378" y="99" width="284" height="46" fill="#f4f4f4" stroke="#aaa" stroke-width="0.8"/>
<text x="520.0" y="128" font-size="15" font-weight="400" text-anchor="middle" fill="#222">孔径 D · 段长 L · 起始深度 d₀</text>
<path d="M178 145 L178 175" fill="none" stroke="#454545" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M520 145 L520 175" fill="none" stroke="#454545" stroke-width="1.25" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="36" y="177" width="284" height="152" fill="#fff" stroke="#555" stroke-width="1"/>
<text x="178.0" y="207" font-size="17" font-weight="600" text-anchor="middle" fill="#222">裂隙实例与中心线</text>
<text x="178.0" y="234" font-size="14" font-weight="400" text-anchor="middle" fill="#555">8 连通域 · 面积与覆盖筛选</text>
<text x="178.0" y="257" font-size="14" font-weight="400" text-anchor="middle" fill="#555">逐列提取纵坐标中位数</text>
<text x="178.0" y="280" font-size="14" font-weight="400" text-anchor="middle" fill="#555">形成单值轮廓点列</text>
<rect x="378" y="177" width="284" height="152" fill="#fff" stroke="#555" stroke-width="1"/>
<text x="520.0" y="207" font-size="17" font-weight="600" text-anchor="middle" fill="#222">物理坐标标定</text>
<text x="520.0" y="234" font-size="14" font-weight="400" text-anchor="middle" fill="#555">横向坐标 x = 列号 × πD / W</text>
<text x="520.0" y="257" font-size="14" font-weight="400" text-anchor="middle" fill="#555">深度 d = d₀ + 行号 × L / H</text>
<text x="520.0" y="280" font-size="14" font-weight="400" text-anchor="middle" fill="#555">统一长度单位：mm</text>
<rect x="720" y="177" width="284" height="152" fill="#fff" stroke="#555" stroke-width="1"/>
<text x="862.0" y="207" font-size="17" font-weight="600" text-anchor="middle" fill="#222">固定周长正弦拟合</text>
<text x="862.0" y="234" font-size="14" font-weight="400" text-anchor="middle" fill="#555"></text>
<text x="862.0" y="257" font-size="14" font-weight="400" text-anchor="middle" fill="#555">线性初值 + soft-L1 最小二乘</text>
<text x="862.0" y="280" font-size="14" font-weight="400" text-anchor="middle" fill="#555">拟合质量：R² · RMSE · 覆盖率</text>
<text x="862" y="234" text-anchor="middle" font-size="17" font-family="Georgia, Times New Roman, serif" font-style="italic">d = C + R sin(2πx / P + β)</text>
<path d="M320 253 L376 253" fill="none" stroke="#454545" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M662 253 L718 253" fill="none" stroke="#454545" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M862 329 L862 353" fill="none" stroke="#454545" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="355" width="968" height="46" fill="#f4f4f4" stroke="#aaa" stroke-width="0.8"/>
<text x="520.0" y="384" font-size="15" font-weight="400" text-anchor="middle" fill="#222">几何成果：振幅 R · 相位 β · 中心深度 C · 拟合质量指标 · 裂隙轮廓与残差</text>
<text x="36" y="430" font-size="13" font-weight="400" text-anchor="start" fill="#666">W、H 为图像宽高，P = πD 为钻孔周长；参数表与轮廓按裂隙实例标识对应。</text>
</g></svg>
